name: V42 Export Source

on:
  push:
    branches: [upgrade-v42-20261002]
    paths: ['.github/workflows/v42-export-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-v42-20261002
          fetch-depth: 1
      - name: Pack complete source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./vendor' \
            --exclude='./storage/logs' \
            --exclude='./node_modules' \
            -czf /tmp/portal-backend-upgrade-v42-current-complete.tar.gz .
          tar -tzf /tmp/portal-backend-upgrade-v42-current-complete.tar.gz | grep -F './resources/views/vendor/pagination/tailwind.blade.php'
          tar -tzf /tmp/portal-backend-upgrade-v42-current-complete.tar.gz | grep -F './Modules/Rental/Routes/web/vendor/routes.php'
      - uses: actions/upload-artifact@v4
        with:
          name: portal-backend-upgrade-v42-current-complete
          path: /tmp/portal-backend-upgrade-v42-current-complete.tar.gz
          retention-days: 1
