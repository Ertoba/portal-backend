name: Live OTP Entropy

on:
  push:
    branches: [main]
    paths:
      - "app/helpers.php"
      - "tests/Unit/LiveOtpEntropyTest.php"
      - ".github/workflows/live-otp-entropy.yml"
  pull_request:
    paths:
      - "app/helpers.php"
      - "tests/Unit/LiveOtpEntropyTest.php"
      - ".github/workflows/live-otp-entropy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, simplexml, mbstring, fileinfo, pdo_sqlite, gd, intl, zip, bcmath
          coverage: none
          tools: composer:v2
      - run: php -l app/helpers.php && php -l tests/Unit/LiveOtpEntropyTest.php
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify cryptographic live OTP and demo isolation
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: vendor/bin/phpunit tests/Unit/LiveOtpEntropyTest.php
