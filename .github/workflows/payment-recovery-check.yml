name: Payment recovery checks

on:
  push:
    branches:
      - fix/keepz-payment-resume
  pull_request:
    branches:
      - main

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, openssl, pdo_sqlite
          tools: composer:v2
      - name: Validate composer metadata
        run: composer validate --no-check-publish
      - name: Lint recovery PHP files
        run: |
          php -l app/Http/Controllers/Api/V1/CheckoutPaymentRecoveryController.php
          php -l app/Http/Middleware/CheckoutOrderLifecycleMiddleware.php
          php -l app/Providers/CheckoutPaymentRecoveryServiceProvider.php
          php -l app/Services/CheckoutPaymentRecoveryService.php
          php -l app/Services/KeepzGatewayLifecycleService.php
          php -l database/migrations/2026_08_02_130000_create_checkout_idempotencies_table.php
          php -l bootstrap/providers.php
      - name: Install application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify route registration and migration
        env:
          APP_ENV: testing
          APP_KEY: base64:WZexSodmlGKb9vIYXXGgkAk9BhO7d8aJndOvcSh6D8M=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          touch database/database.sqlite
          php artisan route:list --path=api/v1/customer/order-payment
          php artisan migrate --pretend --path=database/migrations/2026_08_02_130000_create_checkout_idempotencies_table.php --force
