name: Payment recovery checks

on:
  push:
    branches:
      - fix/keepz-payment-resume
  pull_request:
    branches:
      - main

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, openssl, pdo_sqlite
          tools: composer:v2
      - name: Validate composer metadata
        run: composer validate --no-check-publish
      - name: Lint recovery PHP files
        run: |
          php -l app/Http/Controllers/Api/V1/CheckoutPaymentRecoveryController.php
          php -l app/Http/Middleware/CheckoutOrderLifecycleMiddleware.php
          php -l app/Providers/CheckoutPaymentRecoveryServiceProvider.php
          php -l app/Services/CheckoutPaymentRecoveryService.php
          php -l app/Services/KeepzGatewayLifecycleService.php
          php -l database/migrations/2026_08_02_130000_create_checkout_idempotencies_table.php
          php -l bootstrap/providers.php
      - name: Install application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify scoped route registration
        env:
          APP_ENV: testing
          APP_KEY: base64:WZexSodmlGKb9vIYXXGgkAk9BhO7d8aJndOvcSh6D8M=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          touch database/database.sqlite
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $uris = [];
            foreach ($app["router"]->getRoutes() as $route) {
                $uris[] = $route->uri();
            }
            $required = [
                "api/v1/customer/order-payment/recoverable",
                "api/v1/customer/order-payment/{order}/status",
                "api/v1/customer/order-payment/{order}/prepare-retry",
                "api/v1/customer/order-payment/{order}/switch-to-cod",
            ];
            foreach ($required as $uri) {
                if (!in_array($uri, $uris, true)) {
                    fwrite(STDERR, "Missing route: {$uri}\n");
                    exit(1);
                }
            }
            echo "Checkout recovery routes registered\n";
          '
      - name: Verify migration SQL
        env:
          APP_ENV: testing
          APP_KEY: base64:WZexSodmlGKb9vIYXXGgkAk9BhO7d8aJndOvcSh6D8M=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate --pretend --path=database/migrations/2026_08_02_130000_create_checkout_idempotencies_table.php --force
