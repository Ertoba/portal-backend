name: Keepz ready state correction

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'Run Keepz ready state correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Map terminal and absent attempts to retry-ready
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Services/CheckoutPaymentRecoveryService.php')
          text = path.read_text()
          old = """        $state = $inspection['state'];
        return response()->json([
"""
          new = """        $state = in_array($inspection['state'], ['terminal', 'absent'], true)
            ? 'ready'
            : $inspection['state'];
        return response()->json([
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one status mapping target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l app/Services/CheckoutPaymentRecoveryService.php
          grep -F "['terminal', 'absent']" app/Services/CheckoutPaymentRecoveryService.php

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keepz-ready-state-fix.yml
          git add app/Services/CheckoutPaymentRecoveryService.php
          git commit -m "Return retry-ready Keepz status"
          git push origin main
