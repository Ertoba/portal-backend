name: Keepz recovery PR hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/keepz-6005-recovery-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Apply verified Keepz recovery patch
        run: python3 .github/scripts/keepz_recovery_patch.py

      - name: Validate PHP syntax and invariants
        shell: bash
        run: |
          php -l app/Services/KeepzGatewayLifecycleService.php
          php -l app/Services/CheckoutPaymentRecoveryService.php
          python3 <<'PY'
          from pathlib import Path
          lifecycle = Path('app/Services/KeepzGatewayLifecycleService.php').read_text()
          recovery = Path('app/Services/CheckoutPaymentRecoveryService.php').read_text()
          checks = {
              '6005 absent state': "result('absent', 'not_found', 'provider_order_absent'" in lifecycle,
              'status retries': 'STATUS_RETRY_DELAYS_MICROSECONDS' in lifecycle,
              'all Keepz attempts': 'private function keepzPayments' in recovery,
              'Keepz order method recovery': "whereIn('payment_method', ['digital_payment', 'keepz'])" in recovery,
              'superseded state': "'state' => 'superseded'" in recovery,
              'payment method included in status': "'payment_method' => $order->payment_method" in recovery,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariant checks failed: ' + ', '.join(failed))
          PY

      - name: Commit source fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keepz-recovery-hotfix.yml
          git rm .github/workflows/keepz-recovery-issue-trigger.yml
          git rm .github/workflows/keepz-pr-hotfix.yml
          git rm .github/scripts/keepz_recovery_patch.py
          git add app/Services/KeepzGatewayLifecycleService.php app/Services/CheckoutPaymentRecoveryService.php
          git commit -m "Fix Keepz recovery state handling"
          git push origin HEAD:${{ github.head_ref }}
