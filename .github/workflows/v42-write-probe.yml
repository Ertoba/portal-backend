name: V42 Write Probe

on:
  push:
    branches:
      - upgrade-v42-20261002
    paths:
      - '.github/workflows/v42-write-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-v42-20261002
      - name: Write probe marker
        run: |
          git config user.name "MILI V4.2 Upgrade"
          git config user.email "mili-v42@users.noreply.github.com"
          printf 'GitHub Actions write probe PASS\n' > .github/v42-write-probe-result.txt
          git add .github/v42-write-probe-result.txt
          git commit -m "chore: verify v4.2 upgrade branch write access"
          git push origin HEAD:upgrade-v42-20261002
