name: Order Handover OTP Security

on:
  push:
    branches: [main]
    paths:
      - "app/Services/Order/OrderOtpGenerator.php"
      - "app/Traits/Order/PlaceNewOrderTrait.php"
      - "app/Http/Controllers/Admin/POSController.php"
      - "app/Http/Controllers/Vendor/POSController.php"
      - "tests/Unit/OrderOtpGeneratorTest.php"
      - ".github/workflows/order-handover-otp.yml"
  pull_request:
    paths:
      - "app/Services/Order/OrderOtpGenerator.php"
      - "app/Traits/Order/PlaceNewOrderTrait.php"
      - "app/Http/Controllers/Admin/POSController.php"
      - "app/Http/Controllers/Vendor/POSController.php"
      - "tests/Unit/OrderOtpGeneratorTest.php"
      - ".github/workflows/order-handover-otp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handover-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, simplexml, mbstring, fileinfo, pdo_sqlite, gd, intl, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: PHP syntax
        run: |
          php -l app/Services/Order/OrderOtpGenerator.php
          php -l app/Traits/Order/PlaceNewOrderTrait.php
          php -l app/Http/Controllers/Admin/POSController.php
          php -l app/Http/Controllers/Vendor/POSController.php
          php -l tests/Unit/OrderOtpGeneratorTest.php
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify order handover OTP integrity
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: vendor/bin/phpunit tests/Unit/OrderOtpGeneratorTest.php
