name: Generate MILI Web Brand Assets

on:
  push:
    branches: [main]
    paths:
      - 'branding/build_site_assets.py'
      - '.github/workflows/mili-brand-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install Pillow==12.0.0 cairosvg==2.8.2
      - name: Generate correct PNG, iOS touch icons, favicons
        run: python branding/build_site_assets.py
      - name: Validate PNG outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = list(Path('public').glob('apple-touch-icon.png'))
          paths += list(Path('public/assets/admin/img').glob('favicon.png'))
          if not paths:
              raise SystemExit('No branding outputs to verify')
          for f in paths:
              with Image.open(f) as image:
                  image.verify()
          print('MILI_ICONS_VALID', len(paths))
          PY
      - name: Commit generated images
        run: |
          git add -A -- public
          if git diff --cached --quiet; then
            echo 'Generated image files were unchanged'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate MILI favicon and browser logos from monogram"
          git push origin HEAD:main
